backend:
  name: github
  branch: main
  repo: paulohp/jessicathings.com
  site_domain: www.jessica.blog.br
  base_url: https://www.jessica.blog.br
  auth_endpoint: oauth

media_library:
  name: cloudinary
  config:
    cloud_name: dnk8j20ch
    api_key: 796316847451711

# media_folder: src/assets/img
# public_folder: src/assets/img
publish_mode: editorial_workflow
collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image" }
      - { label: "Description", name: "description", widget: "string" }
      - label: "Categories"
        name: "categories"
        widget: "select"
        multiple: true
        required: false
        options:
          - "Modeladores e Cacheadores"
          - "Livros"
          - "Betim"
          - "Cabelo"
          - "Cabelos Coloridos"
          - "Canadá"
          - "Chile"
          - "Corpo"
          - "Escova Para Escovar o Cabelo"
          - "Escovas Térmicas"
          - "Escovas Secadoras"
          - "Estados Unidos"
          - "Haia"
          - "Holanda"
          - "Ilhas Canárias"
          - "Indonésia"
          - "Malásia"
          - "Maquiagem"
          - "Nômades Digitais"
          - "Outros"
          - "Países"
          - "Peru"
          - "Poland"
          - "Produtos de Cabelo"
          - "Rosto"
          - "Secador de Cabelo"
          - "Serra do Cipó"
          - "Tecnologia"
          - "Hair Tools"
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "gallery"
    label: "Galeria"
    label_singular: "Item da Galeria"
    folder: "src/content/gallery"
    create: true
    identifier_field: "alt"
    fields:
      - {
          label: "Imagem",
          name: "image",
          widget: "image",
          hint: "Upload da foto ou thumbnail do vídeo",
        }
      - {
          label: "Fotos do Carrossel",
          name: "images",
          widget: "image",
          multiple: true,
          required: false,
          hint: "Adicione 2 ou mais fotos para criar um carrossel (clicável para trocar de foto). Se vazio, usa apenas a Imagem acima.",
        }
      - { label: "Texto alternativo", name: "alt", widget: "string" }
      - {
          label: "Legenda",
          name: "caption",
          widget: "string",
          required: false,
          hint: "Aparece ao passar o mouse e no lightbox",
        }
      - label: "Tipo"
        name: "type"
        widget: "select"
        default: "photo"
        options:
          - { label: "📷 Foto", value: "photo" }
          - { label: "🎥 Vídeo", value: "video" }
      - {
          label: "Link do vídeo",
          name: "videoSrc",
          widget: "string",
          required: false,
          hint: "URL do vídeo no Cloudinary, YouTube ou Vimeo. Só para tipo 'Vídeo'.",
        }
      - {
          label: "Largura (px)",
          name: "width",
          widget: "number",
          required: false,
          hint: "Largura original da imagem para manter proporção",
          value_type: "int",
        }
      - {
          label: "Altura (px)",
          name: "height",
          widget: "number",
          required: false,
          hint: "Altura original da imagem para manter proporção",
          value_type: "int",
        }
      - {
          label: "Data",
          name: "date",
          widget: "datetime",
          required: false,
          hint: "Data da foto/vídeo para ordenação",
        }
      - {
          label: "Rascunho",
          name: "draft",
          widget: "boolean",
          default: false,
          required: false,
          hint: "Marque para esconder do site",
        }
